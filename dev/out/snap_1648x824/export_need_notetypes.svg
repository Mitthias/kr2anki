<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="824" viewBox="0 0 1648 824" style="background:#fff">
<rect x="0" y="0" width="1648" height="824" rx="0" fill="#ffffff"/>
<text x="29" y="74" style="font-family:Helvetica, Arial, sans-serif;font-size:53px" fill="#000000">‹</text>
<text x="111" y="70" style="font-family:Helvetica, Arial, sans-serif;font-weight:600;font-size:41px" fill="#000000">Export to Anki</text>
<text x="1447" y="65" style="font-family:Helvetica, Arial, sans-serif;font-weight:600;font-size:28px" fill="#000000">● Connected</text>
<rect x="0" y="111" width="1648" height="4" fill="#000000"/>
<rect x="30" y="130" width="1588" height="438" rx="11" fill="#ffffff"/>
<rect x="31.5" y="131.5" width="1585.0" height="435.0" rx="11" fill="none" stroke="#000000" stroke-width="3"/>
<text x="56" y="194" text-anchor="start" style="font-family:Helvetica, Arial, sans-serif;font-weight:600;font-size:41px" fill="#000000">Anki needs the KR2Anki note types.</text>
<text x="56" y="249" text-anchor="start" style="font-family:Helvetica, Arial, sans-serif;font-size:28px" fill="#444444">AnkiConnect Android can't create note types on this phone, so they are installed once from a</text>
<text x="56" y="285" text-anchor="start" style="font-family:Helvetica, Arial, sans-serif;font-size:28px" fill="#444444">package:</text>
<text x="56" y="329" text-anchor="start" style="font-family:Helvetica, Arial, sans-serif;font-size:28px" fill="#000000">1. Tap Write note-type package.</text>
<text x="56" y="365" text-anchor="start" style="font-family:Helvetica, Arial, sans-serif;font-size:28px" fill="#000000">2. In AnkiDroid: ⋮ ▸ Import ▸ koreader/kr2anki-export/kr2anki_notetypes.apkg.</text>
<text x="56" y="401" text-anchor="start" style="font-family:Helvetica, Arial, sans-serif;font-size:28px" fill="#000000">3. Come back and tap Check again.</text>
<rect x="56" y="431" width="502" height="111" rx="11" fill="#ffffff"/>
<rect x="57.5" y="432.5" width="499.0" height="108.0" rx="11" fill="none" stroke="#000000" stroke-width="3"/>
<text x="71" y="496" style="font-family:Helvetica, Arial, sans-serif;font-weight:600;font-size:28px" fill="#000000">Save as Anki package (.apkg) …</text>
<rect x="573" y="431" width="502" height="111" rx="11" fill="#ffffff"/>
<rect x="574.5" y="432.5" width="499.0" height="108.0" rx="11" fill="none" stroke="#000000" stroke-width="3"/>
<text x="739" y="496" style="font-family:Helvetica, Arial, sans-serif;font-weight:600;font-size:28px" fill="#000000">Check again</text>
<rect x="1090" y="431" width="502" height="111" rx="11" fill="#000000"/>
<text x="1164" y="496" style="font-family:Helvetica, Arial, sans-serif;font-weight:600;font-size:28px" fill="#ffffff">Write note-type package</text>
<rect x="0" y="663" width="1648" height="4" fill="#000000"/>
<rect x="30" y="690" width="1588" height="111" rx="11" fill="#ffffff"/>
<rect x="31.5" y="691.5" width="1585.0" height="108.0" rx="11" fill="none" stroke="#000000" stroke-width="3"/>
<text x="768" y="757" style="font-family:Helvetica, Arial, sans-serif;font-weight:600;font-size:34px" fill="#000000">Cancel</text>
